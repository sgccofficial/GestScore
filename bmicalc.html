<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">

<style>
:root{
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --input-bg: #f1f5f9;
  --badge-bg: #e0e7ff;
  --badge-text: #3730a3;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --radius-lg: 20px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --transition: all 0.2s ease;
}

body.dark{
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --border: #334155;
  --input-bg: #0f172a;
  --badge-bg: #3730a3;
  --badge-text: #e0e7ff;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);
}

*{box-sizing:border-box;font-family:'Inter',sans-serif;color:var(--text);}
body{margin:0;background:var(--bg);transition:var(--transition);-webkit-font-smoothing: antialiased;}

header{
  background:var(--primary);
  color:white;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:var(--shadow);
  position:sticky;
  top:0;
  z-index:10;
}

h1{font-family:'Poppins',sans-serif;margin:0;font-size:22px;color:white;font-weight:600;}
.menu-btn{font-size:24px;cursor:pointer;color:white;transition:var(--transition);}
.menu-btn:hover{opacity:0.8;}

.menu-overlay {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(2px);
  z-index:999;
  opacity:0;
  visibility:hidden;
  transition:all 0.3s ease;
}
.menu-overlay.open {
  opacity:1;
  visibility:visible;
}

.side-menu{
  position:fixed;
  top:0;
  right:-100%;
  width:300px;
  max-width:85vw;
  height:100%;
  background:var(--card);
  box-shadow:-5px 0 30px rgba(0,0,0,0.2);
  display:flex;
  flex-direction:column;
  transition:0.4s cubic-bezier(0.25, 1, 0.5, 1);
  z-index:1000;
  border-left:1px solid var(--border);
}
.side-menu.open{right:0;}

.side-menu-header {
  padding:24px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
  background:var(--bg);
}

.side-menu-title {
  font-family:'Poppins',sans-serif;
  font-size:18px;
  font-weight:600;
  color:var(--text);
  margin:0;
}

.close-btn{
  font-size:20px;
  cursor:pointer;
  color:var(--text-muted);
  transition:var(--transition);
  display:flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  border-radius:50%;
  background:var(--input-bg);
}
.close-btn:hover{
  color:var(--text);
  background:var(--border);
}

.side-menu-content {
  padding:20px;
  overflow-y:auto;
  flex:1;
}

.menu-item{
  margin-bottom:12px;
  padding:16px;
  border-radius:16px;
  background:var(--input-bg);
  cursor:pointer;
  transition:var(--transition);
  font-size:15px;
  display:flex;
  flex-direction:column;
  border:2px solid transparent;
}
.menu-item:hover{
  background:var(--badge-bg);
  border-color:var(--badge-text);
  transform:translateX(4px);
}
.menu-item-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
}

.dark-toggle{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.dark-icon{
  transition:transform 0.3s ease;
  font-size:18px;
}
body.dark .dark-icon{
  transform:rotate(180deg) scale(1.1);
}

.container{padding:20px;max-width:560px;margin:auto;}

.card{
  background:var(--card);
  border-radius:var(--radius-lg);
  padding:20px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  transition:var(--transition);
  display:flex;
  flex-direction:column;
  align-items:center;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  width:100%;
}

.bar{
  background:var(--badge-bg);
  color:var(--badge-text);
  padding:6px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  text-align:center;
  margin-bottom:8px;
  display:inline-block;
}

.sub{
  font-size:13px;
  color:var(--text-muted);
  text-align:center;
  font-weight:500;
}

input[type="number"]{
  width:100%;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:10px 12px;
  margin-top:8px;
  font-size:15px;
  background:var(--input-bg);
  color:var(--text);
  transition:var(--transition);
  outline:none;
  text-align:center;
}
input[type="number"]:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--badge-bg);
}

.big{
  font-size:32px;
  font-weight:700;
  text-align:center;
  margin-top:16px;
  color:var(--primary);
  font-family:'Poppins',sans-serif;
}
body.dark .big {
  color:var(--badge-text);
}

.unit{
  text-align:center;
  font-size:13px;
  color:var(--text-muted);
  margin-top:4px;
}

.error{
  color:#ef4444;
  font-size:14px;
  text-align:center;
  margin-top:8px;
  font-weight:500;
}

.cat-list{
  margin-top:16px;
  width:100%;
  display:grid;
  gap:8px;
}

.cat-item{
  padding:12px;
  border-radius:var(--radius-md);
  font-size:14px;
  font-weight:600;
  display:flex;
  justify-content:space-between;
}

@media (max-width: 480px) {
  .container {
    padding: 12px;
  }
  .card {
    padding: 14px;
    margin-bottom: 14px;
  }
  .row {
    gap: 10px;
  }
  .bar {
    font-size: 11px;
    padding: 4px 8px;
  }
  .sub, .unit {
    font-size: 11px;
  }
  input[type="number"] {
    font-size: 13px;
    padding: 8px;
  }
  .big {
    font-size: 24px;
  }
  .cat-item {
    font-size: 12px;
    padding: 10px;
  }
}
</style>
</head>

<body>

<header>
  <h1>BMI Calculator</h1>
  <div class="menu-btn" onclick="toggleMenu(true)">☰</div>
</header>

<!-- SIDE MENU -->
<div class="menu-overlay" id="overlay" onclick="toggleMenu(false)"></div>

<div class="side-menu" id="menu">
  <div class="side-menu-header">
    <h2 class="side-menu-title">Menu</h2>
    <div class="close-btn" onclick="toggleMenu(false)">✕</div>
  </div>

  <div class="side-menu-content">
    <!-- DARK MODE -->
    <div class="menu-item" onclick="toggleDarkMode()">
      <div class="menu-item-row">
        <span style="font-weight:600;">Dark Mode</span>
        <span class="dark-icon" id="icon">🌙</span>
      </div>
    </div>

    <div class="menu-item">
      <b style="color:var(--primary);margin-bottom:8px;">Disclaimer</b>
      <span style="font-size:13px;line-height:1.5;color:var(--text-muted);">This tool is for educational purposes only and should not replace clinical judgment.</span>
    </div>

    <div class="menu-item">
      <b style="color:var(--primary);margin-bottom:8px;">About</b>
      <span style="font-size:13px;color:var(--text-muted);">©SGCC OFFICIAL</span>
    </div>

    <div class="menu-item" onclick="toggleApps()">
      <div class="menu-item-row">
        <span style="font-weight:600;">Other Apps</span>
        <span id="appsArrow" style="font-size:18px;color:var(--primary);">▾</span>
      </div>
    </div>

    <div id="appsList" style="display:none; margin-top:4px;">
      <div class="menu-item" style="background:var(--bg); border:1px solid var(--border);" onclick="toggleMenu(false); goBMI()">
        <div class="menu-item-row">
          <span style="font-weight:500;">GestScore</span>
          <span style="color:var(--text-muted);">→</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container">

<!-- INPUT -->
<div class="row">
  <div class="card">
    <div class="bar">Weight</div>
    <div class="sub">kg</div>
    <input type="number" id="weight">
  </div>

  <div class="card">
    <div class="bar">Height</div>
    <div class="sub">cm</div>
    <input type="number" id="height">
  </div>
</div>

<!-- RESULT -->
<div class="card">
  <div class="bar">Result</div>
  <div class="big" id="result">--</div>
  <div class="unit">kg/m²</div>
  <div class="error" id="error"></div>
</div>

<!-- CATEGORY LIST -->
<div class="card">
  <div class="bar">BMI Categories</div>
  <div class="cat-list">
    <div class="cat-item" style="background-color:rgba(66, 165, 245, 0.15); color:#2196f3;">
      <span>Underweight</span><span>&lt; 18.5</span>
    </div>
    <div class="cat-item" style="background-color:rgba(102, 187, 106, 0.15); color:#4caf50;">
      <span>Normal</span><span>18.5 – 24.9</span>
    </div>
    <div class="cat-item" style="background-color:rgba(255, 167, 38, 0.15); color:#ff9800;">
      <span>Overweight</span><span>25 – 29.9</span>
    </div>
    <div class="cat-item" style="background-color:rgba(239, 83, 80, 0.15); color:#f44336;">
      <span>Obese</span><span>≥ 30</span>
    </div>
  </div>
</div>

</div>

<script>
const icon = document.getElementById("icon");

// DARK MODE LOAD
if(localStorage.getItem("dark") === "true"){
  document.body.classList.add("dark");
}

function toggleDarkMode(){
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", document.body.classList.contains("dark"));
  icon.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
}

icon.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";

// Menu State
function toggleMenu(show) {
  const menu = document.getElementById('menu');
  const overlay = document.getElementById('overlay');
  if (show) {
    menu.classList.add('open');
    overlay.classList.add('open');
  } else {
    menu.classList.remove('open');
    overlay.classList.remove('open');
  }
}

// BMI CALC
function calculate(){
  let w = weight.value;
  let h = height.value;

  error.innerText = "";
  result.innerText = "--";

  if(!w || !h){
    error.innerText = "Enter weight and height";
    return;
  }

  if(w<=0 || h<=0){
    error.innerText = "Invalid values";
    return;
  }

  let bmi = w / ((h/100)*(h/100));
  let cat = "";
  let color = "";

  if(bmi < 18.5){ cat="Underweight"; color="#42a5f5"; }
  else if(bmi < 24.9){ cat="Normal"; color="#66bb6a"; }
  else if(bmi < 29.9){ cat="Overweight"; color="#ffa726"; }
  else{ cat="Obese"; color="#ef5350"; }

  result.innerText = bmi.toFixed(2) + " (" + cat + ")";
  result.style.color = color;
}

// AUTO UPDATE
weight.oninput = calculate;
height.oninput = calculate;

//Menu Update
function toggleApps(){
  let list = document.getElementById("appsList");
  let arrow = document.getElementById("appsArrow");

  if(list.style.display === "block" || list.style.display === ""){
    list.style.display = "none";
    arrow.textContent = "▾";
  } else {
    list.style.display = "block";
    arrow.textContent = "▴";
  }
}
function goBMI(){
  window.location.href = "./index.html";
}
</script>

</body>
</html>
